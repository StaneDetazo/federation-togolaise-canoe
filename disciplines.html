<body data-page="disciplines" data-entete="transparent" class="bg-white font-sans text-encre antialiased">
  <a class="lien-evitement" href="#main">Aller au contenu principal</a>
  <div id="site-header"></div>

  <main id="main">
    <div data-zone="bandeau"></div>

    <!-- Introduction -->
    <section class="bg-white py-14 lg:py-16">
      <div class="mx-auto max-w-ecran px-4 sm:px-6">

          <p data-zone="entete-texte" class="text-base leading-relaxed text-encre-doux"></p>

      </div>
    </section>

    <section class="bg-sable-50 py-16 lg:py-20">

          <label class="relative flex w-full flex-none items-center lg:w-80">

        </div>

    <section class="bg-white py-16 lg:py-24">
      <div class="mx-auto max-w-ecran px-4 sm:px-6">

          <h2 class="mt-5 titre-section text-vert-950">Chaque activité en détail</h2>

        <div data-zone="disciplines-fiches" class="mt-10 space-y-6"></div>
      </div>
    </section>

      <div class="mx-auto max-w-ecran px-4 sm:px-6">
        <header class="revele max-w-2xl">
          <p class="etiquette text-vert-600">Formations</p>

          <p data-zone="formations-intro" class="mt-5 text-base leading-relaxed text-encre-doux"></p>
        </header>
        <div data-zone="formations-liste" class="mt-10 overflow-hidden rounded-2xl border border-sable-200"></div>
        <p data-zone="formations-note" class="mt-6 flex items-start gap-2 rounded-xl border border-soleil-300 bg-soleil-50 px-4 py-3 text-sm text-encre-doux hidden"></p>
