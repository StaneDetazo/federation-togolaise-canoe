<body data-page="clubs" data-entete="transparent" class="bg-white font-sans text-encre antialiased">
  <a class="lien-evitement" href="#main">Aller au contenu principal</a>
  <div id="site-header"></div>

  <main id="main">
    <div data-zone="bandeau"></div>

    <!-- Annuaire -->
    <section class="bg-white py-16 lg:py-24">
      <div class="mx-auto max-w-ecran px-4 sm:px-6">
        <header class="revele max-w-2xl">
          <p data-zone="annuaire-etiquette" class="etiquette text-vert-600">Annuaire</p>
          <h2 data-zone="annuaire-titre" class="mt-5 titre-section text-vert-950">Les clubs affiliés</h2>
          <p data-zone="annuaire-intro" class="mt-5 text-base leading-relaxed text-encre-doux"></p>
        </header>

        <!-- Filtres -->
        <div class="revele mt-10 rounded-2xl border border-sable-200 bg-sable-50 p-6 sm:p-7">
          <div class="grid gap-6 lg:grid-cols-[1.3fr_1fr] lg:items-end">
            <div>
              <p class="text-[0.68rem] font-semibold uppercase tracking-[0.14em] text-encre-clair">Région</p>
              <div data-zone="filtres-regions" class="mt-3 flex flex-wrap gap-2"></div>
            </div>
            <div>
              <label for="recherche-clubs" class="text-[0.68rem] font-semibold uppercase tracking-[0.14em] text-encre-clair">Recherche</label>
              <div class="relative mt-3 flex items-center">
                <input id="recherche-clubs" type="search" placeholder="Nom du club, ville…"
                  class="w-full rounded-full border border-sable-200 bg-white py-3 pl-5 pr-11 text-sm text-vert-950 placeholder:text-encre-clair focus:border-vert-400 focus:outline-none">
                <span data-icone-recherche class="pointer-events-none absolute right-4 text-encre-clair"></span>
              </div>
            </div>
          </div>
          <div class="mt-6 flex flex-wrap items-center justify-between gap-3 border-t border-sable-200 pt-5">
            <p data-zone="compteur-clubs" class="text-sm text-encre-clair"></p>
            <button type="button" data-zone="reinitialiser" class="text-sm font-semibold text-vert-700 transition hover:text-vert-900">Réinitialiser les filtres</button>
          </div>
        </div>

        <div data-zone="clubs-grille" class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
      </div>
    </section>

    <!-- Repères -->
    <section class="bg-sable-50 py-16 lg:py-20">
      <div class="mx-auto max-w-ecran px-4 sm:px-6">
        <header class="revele max-w-2xl">
          <p data-zone="reperes-etiquette" class="etiquette text-vert-600">Repères</p>
          <h2 data-zone="reperes-titre" class="mt-5 titre-section text-vert-950">Le réseau en chiffres</h2>
          <p data-zone="reperes-intro" class="mt-5 text-base leading-relaxed text-encre-doux"></p>
        </header>
        <div data-zone="reperes-liste" class="mt-10 grid gap-4 sm:grid-cols-2"></div>
      </div>
    </section>

    <!-- Affiliation -->
    <section id="devenir-club" class="scroll-mt-32 bg-white py-16 lg:py-24">
      <div class="mx-auto max-w-ecran px-4 sm:px-6">
        <div class="revele relative isolate overflow-hidden rounded-[2rem] bg-vert-900 px-6 py-12 text-white sm:px-10 lg:px-16 lg:py-16">
          <span class="pointer-events-none absolute -right-20 -top-24 h-72 w-72 rounded-full bg-vert-700/40 blur-3xl" aria-hidden="true"></span>
          <span class="pointer-events-none absolute -bottom-24 -left-16 h-64 w-64 rounded-full bg-soleil-500/10 blur-3xl" aria-hidden="true"></span>
          <div class="relative grid gap-10 lg:grid-cols-[1.4fr_1fr] lg:items-center">
            <div>
              <p class="etiquette text-soleil-300">Affiliation</p>
              <h2 data-zone="devenir-titre" class="mt-5 font-display text-2xl font-bold leading-tight text-white sm:text-3xl"></h2>
              <p data-zone="devenir-texte" class="mt-5 max-w-xl text-base leading-relaxed text-vert-50/85"></p>
            </div>
            <div class="lg:justify-self-end">
              <p data-zone="devenir-note" class="text-sm leading-relaxed text-vert-50/80"></p>
              <a href="contact.html" class="btn btn--soleil mt-6 w-full justify-center sm:w-auto">Contacter la fédération</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="js/pages/clubs.js"></script>
</body>
</html>
